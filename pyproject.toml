[project]
name = "qcl-negf-results"
version = "0.2.0"
description = "Validated scientific result snapshots, diagnostics and bounded exports"
dependencies = ["qcl-negf-contracts==0.2.0", "numpy>=2.3,<3", "h5py>=3.14,<4", "ijson>=3.4,<4", "pyarrow>=21,<26"]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"

[project.urls]
Repository = "https://github.com/AfonenkoA/qcl-negf-results"
Issues = "https://github.com/AfonenkoA/qcl-negf-results/issues"

[project.scripts]
qcl-negf-results = "qcl_negf_results.cli:main"
qcl-negf-receive = "qcl_negf_results.multipart:main"

[project.optional-dependencies]
test = ["pytest>=8.4,<10", "jsonschema>=4.23,<5"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qcl_negf_results"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
